<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claude MD Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg-primary:   #1C1917;
  --bg-secondary: #242220;
  --bg-tertiary:  #2D2A27;
  --bg-hover:     #343130;
  --border:       #3D3A37;
  --border-light: #4A4744;
  --text-primary: #F2EDE8;
  --text-secondary:#B8AFA8;
  --text-muted:   #7A7470;
  --accent:       #CF6A4C;
  --accent-hover: #D97855;
  --accent-soft:  rgba(207,106,76,0.12);
  --accent-glow:  rgba(207,106,76,0.25);
  --success:      #5FA37A;
  --code-bg:      #161412;
  --selection:    rgba(207,106,76,0.3);
  --scrollbar:    #3D3A37;
  --font-display: 'Lora', Georgia, serif;
  --font-ui:      'DM Sans', sans-serif;
  --font-mono:    'DM Mono', 'Courier New', monospace;
  --radius:       6px;
  --radius-lg:    10px;
  --transition:   0.18s ease;
  --sidebar-w:    54px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
::selection { background: var(--selection); }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-ui);
  background: var(--bg-primary);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  height: 100vh;
  font-size: 14px;
}

/* ── MENU BAR ─────────────────────────────── */
.menubar {
  display: flex;
  align-items: center;
  height: 36px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  padding: 0 8px;
  gap: 0;
  user-select: none;
  position: relative;
  z-index: 500;
}

.menu-logo {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 10px 0 4px;
  margin-right: 4px;
  border-right: 1px solid var(--border);
}
.menu-logo-icon {
  width: 22px;
  height: 22px;
  background: var(--accent);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  color: #fff;
  font-weight: 700;
  box-shadow: 0 0 8px var(--accent-glow);
  flex-shrink: 0;
}
.menu-logo-text {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
}

.menu-group {
  position: relative;
}
.menu-btn {
  background: none;
  border: none;
  color: var(--text-secondary);
  font-family: var(--font-ui);
  font-size: 13.5px;
  padding: 0 11px;
  height: 36px;
  cursor: pointer;
  border-radius: 4px;
  transition: all var(--transition);
  white-space: nowrap;
}
.menu-btn:hover, .menu-btn.open {
  background: var(--bg-hover);
  color: var(--text-primary);
}
.menu-dd {
  display: none;
  position: absolute;
  top: calc(100% + 2px);
  left: 0;
  background: var(--bg-secondary);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  min-width: 230px;
  padding: 5px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  z-index: 9999;
  animation: ddFadeIn 0.12s ease;
}
.menu-dd.open { display: block; }
@keyframes ddFadeIn { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform: none; } }
.menu-dd button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  background: none;
  border: none;
  color: var(--text-secondary);
  font-family: var(--font-ui);
  font-size: 13.5px;
  padding: 7px 11px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
  gap: 16px;
  text-align: left;
}
.menu-dd button:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}
.menu-dd button.danger:hover { background: rgba(207,76,76,0.15); color: #E07070; }
.menu-dd .menu-sep {
  height: 1px;
  background: var(--border);
  margin: 4px 6px;
}
.menu-dd kbd {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  white-space: nowrap;
  flex-shrink: 0;
}

.menubar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  padding-left: 10px;
}
.wc-badge {
  font-size: 12px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  padding: 0 9px;
  height: 26px;
  display: flex;
  align-items: center;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  gap: 5px;
  white-space: nowrap;
}
.wc-badge span { color: var(--accent); font-weight: 500; }

.view-toggle {
  display: flex;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 2px;
  gap: 2px;
}
.toggle-btn {
  padding: 4px 11px;
  border-radius: 4px;
  border: none;
  background: none;
  color: var(--text-muted);
  font-size: 12.5px;
  font-family: var(--font-ui);
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}
.toggle-btn.active { background: var(--bg-hover); color: var(--text-primary); }
.toggle-btn:hover:not(.active) { color: var(--text-secondary); }

/* ── TABS BAR ─────────────────────────────── */
.tabs-bar {
  display: flex;
  align-items: stretch;
  height: 42px;
  background: var(--bg-primary);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  position: relative;
}
.tabs-bar::-webkit-scrollbar { display: none; }

.tabs-list {
  display: flex;
  align-items: stretch;
  flex: 1;
  gap: 0;
}

.tab-item {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 14px 0 16px;
  border-right: 1px solid var(--border);
  background: var(--bg-primary);
  color: var(--text-muted);
  font-size: 13.5px;
  font-family: var(--font-ui);
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
  min-width: 110px;
  max-width: 220px;
  position: relative;
  user-select: none;
}
.tab-item:hover { background: var(--bg-secondary); color: var(--text-secondary); }
.tab-item.active {
  background: var(--bg-secondary);
  color: var(--text-primary);
  border-bottom: 2px solid var(--accent);
}
.tab-item.active::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0; right: 0;
  height: 1px;
  background: var(--bg-secondary);
}
.tab-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  opacity: 0;
  transition: opacity var(--transition);
}
.tab-item.modified .tab-dot { opacity: 1; }
.tab-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-mono);
  font-size: 12.5px;
}
.tab-label input {
  background: none;
  border: none;
  outline: 1px solid var(--accent);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 12.5px;
  width: 100%;
  border-radius: 2px;
  padding: 1px 3px;
}
.tab-close {
  width: 18px; height: 18px;
  border-radius: 3px;
  border: none;
  background: none;
  color: var(--text-muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  transition: all var(--transition);
  flex-shrink: 0;
}
.tab-close:hover { background: var(--bg-hover); color: var(--text-primary); }
.tab-add {
  display: flex;
  align-items: center;
  padding: 0 14px;
  background: none;
  border: none;
  border-right: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 20px;
  cursor: pointer;
  transition: all var(--transition);
  flex-shrink: 0;
  line-height: 1;
}
.tab-add:hover { background: var(--bg-secondary); color: var(--text-primary); }

.tabs-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  margin-left: auto;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 13px;
  height: 30px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}
.btn-ghost {
  background: transparent;
  border-color: var(--border);
  color: var(--text-secondary);
}
.btn-ghost:hover { background: var(--bg-hover); border-color: var(--border-light); color: var(--text-primary); }
.btn-accent {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 1px 6px var(--accent-glow);
}
.btn-accent:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 2px 10px var(--accent-glow); }
.btn-accent:active { transform: translateY(0); }

/* ── MAIN AREA ────────────────────────────── */
.main-area {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
}

/* ── LEFT SIDEBAR ─────────────────────────── */
.left-sidebar {
  width: var(--sidebar-w);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 0;
  gap: 2px;
  flex-shrink: 0;
  overflow-y: auto;
  overflow-x: visible;
  scrollbar-width: none;
}
.left-sidebar::-webkit-scrollbar { display: none; }

.sb-btn {
  width: 40px;
  height: 36px;
  border: none;
  background: none;
  border-radius: var(--radius);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  flex-shrink: 0;
  font-family: var(--font-ui);
  font-weight: 600;
  position: relative;
}
.sb-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.sb-btn:active { background: var(--accent-soft); color: var(--accent); transform: scale(0.9); }
.sb-sep {
  width: 28px;
  height: 1px;
  background: var(--border);
  margin: 4px 0;
  flex-shrink: 0;
}
.sb-label {
  font-size: 9px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-family: var(--font-ui);
  text-align: center;
  padding: 4px 0 2px;
}

/* ── WORKSPACE ────────────────────────────── */
.workspace {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
}

.panel {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  transition: flex 0.25s ease;
}
.panel.hidden { display: none; }

.panel-label {
  padding: 6px 16px;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.preview-edit-hint {
  font-size: 10px;
  color: var(--accent);
  opacity: 0.7;
  text-transform: none;
  letter-spacing: 0;
}

/* EDITOR */
.editor-panel { border-right: 1px solid var(--border); }
.editor-area {
  flex: 1;
  overflow-y: auto;
  position: relative;
}
.editor-wrap {
  display: flex;
  min-height: 100%;
}
.line-numbers {
  padding: 18px 0;
  min-width: 46px;
  text-align: right;
  padding-right: 12px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.75;
  user-select: none;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  flex-shrink: 0;
  opacity: 0.6;
}

textarea#editor {
  flex: 1;
  background: var(--bg-primary);
  color: var(--text-primary);
  border: none;
  outline: none;
  resize: none;
  padding: 18px 20px;
  font-family: var(--font-mono);
  font-size: 14.5px;
  line-height: 1.75;
  tab-size: 2;
  caret-color: var(--accent);
  white-space: pre-wrap;
  overflow-wrap: break-word;
  overflow-x: hidden;
  min-height: 100%;
}
textarea#editor::placeholder { color: var(--text-muted); }
textarea#editor::-webkit-scrollbar { width: 5px; }
textarea#editor::-webkit-scrollbar-track { background: transparent; }
textarea#editor::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

/* ── FIND & REPLACE PANEL ──────────────────── */
.find-panel {
  position: absolute;
  top: 10px;
  right: 18px;
  z-index: 120;
  background: var(--bg-secondary);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  padding: 8px;
  display: none;
  flex-direction: column;
  gap: 6px;
  width: 340px;
  animation: ddFadeIn 0.12s ease;
}
.find-panel.open { display: flex; }
.find-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.find-input-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0 8px;
  height: 30px;
  transition: border-color var(--transition);
}
.find-input-wrap:focus-within { border-color: var(--accent); }
.find-input-wrap input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 13px;
  height: 100%;
}
.find-input-wrap input::placeholder { color: var(--text-muted); }
.find-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  white-space: nowrap;
  padding-left: 6px;
  flex-shrink: 0;
}
.find-count.nores { color: #E07070; }
.find-btn {
  width: 28px; height: 30px;
  flex-shrink: 0;
  border: 1px solid var(--border);
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border-radius: var(--radius);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  transition: all var(--transition);
  font-family: var(--font-ui);
}
.find-btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-light); }
.find-btn.toggle.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.find-btn.wide { width: auto; padding: 0 10px; font-size: 12px; white-space: nowrap; }
.find-close {
  width: 28px; height: 30px;
  flex-shrink: 0;
  border: none; background: none;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: var(--radius);
  font-size: 16px;
  transition: all var(--transition);
}
.find-close:hover { background: var(--bg-hover); color: var(--text-primary); }
.find-options { display: flex; gap: 4px; }

/* DIVIDER */
.divider {
  width: 4px;
  background: var(--border);
  cursor: col-resize;
  flex-shrink: 0;
  transition: background var(--transition);
  position: relative;
}
.divider:hover, .divider.dragging { background: var(--accent); }
.divider::after { content: ''; position: absolute; inset: 0 -4px; }

/* PREVIEW */
.preview-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 32px 40px;
  background: var(--bg-primary);
}
.editor-area::-webkit-scrollbar,
.preview-scroll::-webkit-scrollbar { width: 5px; }
.editor-area::-webkit-scrollbar-track,
.preview-scroll::-webkit-scrollbar-track { background: transparent; }
.editor-area::-webkit-scrollbar-thumb,
.preview-scroll::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

.preview-content {
  max-width: 720px;
  margin: 0 auto;
  font-family: var(--font-display);
  font-size: 16.5px;
  line-height: 1.85;
  color: var(--text-primary);
  outline: none;
  min-height: 100%;
}
.preview-content.editing-mode {
  outline: 1px dashed rgba(207,106,76,0.3);
  border-radius: var(--radius);
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity:1; transform:none; } }

.preview-content h1, .preview-content h2, .preview-content h3,
.preview-content h4, .preview-content h5, .preview-content h6 {
  font-family: var(--font-display);
  color: var(--text-primary);
  line-height: 1.3;
  margin-top: 2em;
  margin-bottom: 0.6em;
  font-weight: 600;
}
.preview-content h1 { font-size: 2.1em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
.preview-content h2 { font-size: 1.5em; }
.preview-content h3 { font-size: 1.25em; color: var(--text-secondary); }
.preview-content h4 { font-size: 1.05em; color: var(--text-secondary); }
.preview-content p { margin-bottom: 1.1em; }
.preview-content a { color: var(--accent); text-decoration: underline; text-decoration-color: var(--accent-soft); transition: color var(--transition); }
.preview-content a:hover { color: var(--accent-hover); }
.preview-content strong { color: var(--text-primary); font-weight: 600; }
.preview-content em { font-style: italic; color: var(--text-secondary); }
.preview-content del { color: var(--text-muted); }
.preview-content ul, .preview-content ol { margin-bottom: 1em; padding-left: 1.6em; }
.preview-content li { margin-bottom: 0.3em; }
.preview-content li::marker { color: var(--accent); }
.preview-content blockquote {
  border-left: 3px solid var(--accent);
  margin: 1.4em 0;
  padding: 0.6em 1.2em;
  background: var(--accent-soft);
  border-radius: 0 var(--radius) var(--radius) 0;
  color: var(--text-secondary);
  font-style: italic;
}
.preview-content code {
  font-family: var(--font-mono);
  font-size: 0.85em;
  background: var(--code-bg);
  color: #E0A07A;
  padding: 0.15em 0.45em;
  border-radius: 4px;
  border: 1px solid var(--border);
}
.preview-content pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  overflow-x: auto;
  margin: 1.4em 0;
  position: relative;
}
.preview-content pre::before {
  content: attr(data-lang);
  position: absolute;
  top: 10px; right: 14px;
  font-size: 10px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.preview-content pre code {
  background: none; border: none; padding: 0;
  color: #D4A47A; font-size: 13.5px; line-height: 1.7;
}
.preview-content table { width: 100%; border-collapse: collapse; margin: 1.4em 0; font-size: 0.93em; }
.preview-content th {
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  font-weight: 500;
  font-family: var(--font-ui);
  font-size: 0.85em;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 9px 13px;
  border-bottom: 2px solid var(--border);
  text-align: left;
}
.preview-content td { padding: 9px 13px; border-bottom: 1px solid var(--border); color: var(--text-secondary); }
.preview-content tr:hover td { background: var(--bg-secondary); }
.preview-content hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
.preview-content img { max-width: 100%; border-radius: var(--radius-lg); border: 1px solid var(--border); }
.preview-content input[type="checkbox"] { accent-color: var(--accent); margin-right: 6px; }

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  min-height: 300px;
  gap: 12px;
  color: var(--text-muted);
}
.empty-icon { font-size: 40px; opacity: 0.3; }
.empty-state p { font-size: 15px; font-family: var(--font-display); font-style: italic; }

/* ── STATUS BAR ────────────────────────────── */
.statusbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 26px;
  padding: 0 16px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  font-size: 11.5px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}
.status-left, .status-right { display: flex; gap: 14px; align-items: center; }
.status-item { display: flex; gap: 4px; align-items: center; }
.status-dot { width: 6px; height: 6px; background: var(--success); border-radius: 50%; }
.status-modified { color: var(--accent); }

<script>
// ═══════════════════════════════════════════════════
// MARKDOWN PARSER
// ═══════════════════════════════════════════════════
function parseMarkdown(md) {
  if (!md.trim()) return '';
  let html = md;
  const escHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    return `<pre data-lang="${escHtml(lang||'')}"><code>${escHtml(code.trimEnd())}</code></pre>`;
  });
  html = html.replace(/^(#{1,6})\s+(.+)$/gm, (_, h, t) => {
    const id = t.toLowerCase().replace(/\s+/g,'-').replace(/[^\w-]/g,'');
    return `<h${h.length} id="${id}">${t}</h${h.length}>`;
  });
  html = html.replace(/^(-{3,}|\*{3,}|_{3,})$/gm, '<hr/>');
  html = html.replace(/^>\s?(.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/^- \[x\] (.+)$/gim, '<li><input type="checkbox" checked disabled> $1</li>');
  html = html.replace(/^- \[ \] (.+)$/gim, '<li><input type="checkbox" disabled> $1</li>');
  html = html.replace(/((?:^[-*+]\s.+\n?)+)/gm, m => {
    const items = m.trim().split('\n').map(l => `<li>${l.replace(/^[-*+]\s/,'')}</li>`).join('');
    return `<ul>${items}</ul>`;
  });
  html = html.replace(/((?:^\d+\.\s.+\n?)+)/gm, m => {
    const items = m.trim().split('\n').map(l => `<li>${l.replace(/^\d+\.\s/,'')}</li>`).join('');
    return `<ol>${items}</ol>`;
  });
  html = html.replace(/^\|(.+)\|\n\|[-| :]+\|\n((?:\|.+\|\n?)*)/gm, (_, header, body) => {
    const ths = header.split('|').map(c=>c.trim()).filter(Boolean).map(c=>`<th>${c}</th>`).join('');
    const trs = body.trim().split('\n').map(row => {
      const tds = row.split('|').map(c=>c.trim()).filter(Boolean).map(c=>`<td>${c}</td>`).join('');
      return `<tr>${tds}</tr>`;
    }).join('');
    return `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
  });
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/_(.+?)_/g, '<em>$1</em>');
  html = html.replace(/~~(.+?)~~/g, '<del>$1</del>');
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1"/>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/\n{2,}/g, '\n\n');
  const lines = html.split('\n\n');
  html = lines.map(block => {
    block = block.trim();
    if (!block) return '';
    if (/^<(h[1-6]|ul|ol|li|pre|blockquote|table|hr|img)/.test(block)) return block;
    return `<p>${block.replace(/\n/g,'<br/>')}</p>`;
  }).join('\n');
  return html;
}

// ═══════════════════════════════════════════════════
// HTML → MARKDOWN (for editable preview sync)
// ═══════════════════════════════════════════════════
function htmlToMarkdown(container) {
  function walk(node) {
    if (node.nodeType === 3) return node.textContent;
    if (node.nodeType !== 1) return '';
    const tag = node.tagName.toLowerCase();
    const kids = () => Array.from(node.childNodes).map(walk).join('');

    if (tag === 'br') return '\n';
    if (tag === 'hr') return '\n---\n\n';
    if (/^h([1-6])$/.test(tag)) {
      const lv = parseInt(tag[1]);
      return '\n' + '#'.repeat(lv) + ' ' + kids() + '\n\n';
    }
    if (tag === 'p') return kids() + '\n\n';
    if (tag === 'strong' || tag === 'b') return '**' + kids() + '**';
    if (tag === 'em' || tag === 'i') return '*' + kids() + '*';
    if (tag === 'del' || tag === 's') return '~~' + kids() + '~~';
    if (tag === 'a') {
      const href = node.getAttribute('href') || '';
      return '[' + kids() + '](' + href + ')';
    }
    if (tag === 'img') {
      return '![' + (node.getAttribute('alt')||'') + '](' + (node.getAttribute('src')||'') + ')';
    }
    if (tag === 'code') {
      if (node.closest('pre')) return kids();
      return '`' + kids() + '`';
    }
    if (tag === 'pre') {
      const lang = node.getAttribute('data-lang') || '';
      const code = node.querySelector('code');
      const content = code ? code.textContent : kids();
      return '\n```' + lang + '\n' + content.trimEnd() + '\n```\n\n';
    }
    if (tag === 'blockquote') {
      return kids().trim().split('\n').map(l => '> ' + l).join('\n') + '\n\n';
    }
    if (tag === 'ul') {
      return Array.from(node.children).map(li => {
        const cb = li.querySelector('input[type="checkbox"]');
        if (cb) return '- [' + (cb.checked ? 'x' : ' ') + '] ' + li.textContent.trim();
        return '- ' + Array.from(li.childNodes).map(walk).join('').trim();
      }).join('\n') + '\n\n';
    }
    if (tag === 'ol') {
      return Array.from(node.children).map((li, i) =>
        (i+1) + '. ' + Array.from(li.childNodes).map(walk).join('').trim()
      ).join('\n') + '\n\n';
    }
    if (tag === 'li') return '';
    if (tag === 'table') {
      const thead = node.querySelector('thead tr');
      const tbody = node.querySelectorAll('tbody tr');
      if (!thead) return '';
      const hs = Array.from(thead.querySelectorAll('th')).map(th => th.textContent.trim());
      const rows = Array.from(tbody).map(tr =>
        Array.from(tr.querySelectorAll('td')).map(td => td.textContent.trim())
      );
      const sep = hs.map(() => '---');
      return '| ' + hs.join(' | ') + ' |\n| ' + sep.join(' | ') + ' |\n' +
        rows.map(r => '| ' + r.join(' | ') + ' |').join('\n') + '\n\n';
    }
    if (['thead','tbody','tr','th','td'].includes(tag)) return '';
    return kids();
  }
  let md = Array.from(container.childNodes).map(walk).join('');
  return md.replace(/\n{3,}/g, '\n\n').trim();
}

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
const editor    = document.getElementById('editor');
const preview   = document.getElementById('preview');
const emptyState = document.getElementById('emptyState');
const lineNums  = document.getElementById('lineNumbers');
const wc        = document.getElementById('wc');
const cc        = document.getElementById('cc');
const tk        = document.getElementById('tk');
const cursorPos = document.getElementById('cursorPos');

let tabs = [];
let activeTabId = null;
let tabIdCounter = 0;
let wordWrap = true;
let previewEditing = false;
let previewSyncTimer = null;
let lsSaveTimer = null;
let openMenuId = null;
let currentView = 'split';

// ═══════════════════════════════════════════════════
// TAB MANAGEMENT
// ═══════════════════════════════════════════════════
function createTab(name='sin-título', content='') {
  const id = ++tabIdCounter;
  const tab = {
    id, name, content,
    savedContent: content,
    undoStack: [content],
    redoStack: [],
    fileHandle: null,
    modified: false
  };
  tabs.push(tab);
  return tab;
}

function getActiveTab() {
  return tabs.find(t => t.id === activeTabId) || null;
}

function switchTab(id) {
  // Save current editor state to active tab
  const cur = getActiveTab();
  if (cur) {
    cur.content = editor.value;
  }
  activeTabId = id;
  const tab = tabs.find(t => t.id === id);
  if (!tab) return;
  editor.value = tab.content;
  updatePreview();
  updateCursor();
  renderTabs();
  updateModifiedIndicator();
}

function newTab() {
  const tab = createTab('sin-título', '');
  renderTabs();
  switchTab(tab.id);
  editor.focus();
  showToast('✓ Nueva pestaña creada');
}

function closeActiveTab() {
  const tab = getActiveTab();
  if (!tab) return;
  if (tabs.length === 1) {
    // Don't close last tab, just clear
    if (tab.content.trim() && !confirm('¿Borrar el contenido de esta pestaña?')) return;
    tab.content = ''; tab.savedContent = ''; tab.modified = false;
    editor.value = '';
    updatePreview();
    renderTabs();
    return;
  }
  if (tab.modified && !confirm(`¿Cerrar "${tab.name}" sin guardar los cambios?`)) return;
  const idx = tabs.findIndex(t => t.id === tab.id);
  tabs.splice(idx, 1);
  const next = tabs[Math.max(0, idx - 1)];
  switchTab(next.id);
  showToast(`✕ Pestaña "${tab.name}" cerrada`);
}

function renameTab(id, newName) {
  const tab = tabs.find(t => t.id === id);
  if (tab && newName.trim()) {
    tab.name = newName.trim();
    renderTabs();
    debouncedSaveToLS();
  }
}

function renderTabs() {
  const list = document.getElementById('tabsList');
  list.innerHTML = '';
  tabs.forEach(tab => {
    const el = document.createElement('div');
    el.className = 'tab-item' + (tab.id === activeTabId ? ' active' : '') + (tab.modified ? ' modified' : '');
    el.dataset.id = tab.id;
    el.innerHTML = `
      <div class="tab-dot"></div>
      <span class="tab-label" ondblclick="startRenameTab(${tab.id}, this)">${escHtml(tab.name)}.md</span>
      <button class="tab-close" onclick="event.stopPropagation(); closeTab(${tab.id})">×</button>
    `;
    el.addEventListener('click', (e) => {
      if (!e.target.closest('.tab-close') && !e.target.closest('input')) switchTab(tab.id);
    });
    list.appendChild(el);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function startRenameTab(id, labelEl) {
  const tab = tabs.find(t => t.id === id);
  if (!tab) return;
  const input = document.createElement('input');
  input.value = tab.name;
  input.onclick = e => e.stopPropagation();
  input.onblur = () => { renameTab(id, input.value); };
  input.onkeydown = e => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { renderTabs(); }
    e.stopPropagation();
  };
  labelEl.innerHTML = '';
  labelEl.appendChild(input);
  input.focus();
  input.select();
}

function closeTab(id) {
  if (id === activeTabId) { closeActiveTab(); return; }
  const tab = tabs.find(t => t.id === id);
  if (!tab) return;
  if (tab.modified && !confirm(`¿Cerrar "${tab.name}" sin guardar?`)) return;
  tabs = tabs.filter(t => t.id !== id);
  renderTabs();
  debouncedSaveToLS();
}

// ═══════════════════════════════════════════════════
// LOCAL STORAGE
// ═══════════════════════════════════════════════════
function saveToLS() {
  try {
    const cur = getActiveTab();
    if (cur) cur.content = editor.value;
    const state = {
      tabs: tabs.map(t => ({
        id: t.id, name: t.name, content: t.content,
        savedContent: t.savedContent, modified: t.modified
      })),
      activeTabId,
      tabIdCounter,
      wordWrap,
      currentView
    };
    localStorage.setItem('claudemd_v3', JSON.stringify(state));
  } catch(e) { console.warn('LS save error:', e); }
}

function debouncedSaveToLS() {
  clearTimeout(lsSaveTimer);
  lsSaveTimer = setTimeout(saveToLS, 600);
}

function loadFromLS() {
  try {
    const raw = localStorage.getItem('claudemd_v3');
    if (!raw) return false;
    const state = JSON.parse(raw);
    if (!state.tabs || !state.tabs.length) return false;
    tabs = state.tabs.map(t => ({
      ...t,
      undoStack: [t.content],
      redoStack: [],
      fileHandle: null
    }));
    tabIdCounter = state.tabIdCounter || tabs.length;
    activeTabId = null;
    wordWrap = state.wordWrap !== undefined ? state.wordWrap : true;
    currentView = state.currentView || 'split';
    const toActivate = tabs.find(t => t.id === state.activeTabId) || tabs[0];
    if (toActivate) activeTabId = toActivate.id;
    return true;
  } catch(e) {
    return false;
  }
}

// ═══════════════════════════════════════════════════
// FILE SYSTEM ACCESS API
// ═══════════════════════════════════════════════════
async function openFile() {
  if (!window.showOpenFilePicker) { triggerImport(); return; }
  try {
    const handles = await window.showOpenFilePicker({
      multiple: true,
      types: [{ description: 'Markdown', accept: {'text/markdown': ['.md','.markdown','.txt']} }]
    });
    for (const handle of handles) {
      const file = await handle.getFile();
      const content = await file.text();
      const name = file.name.replace(/\.(md|markdown|txt)$/i, '');
      const existing = tabs.find(t => t.name === name);
      if (existing) { switchTab(existing.id); continue; }
      const tab = createTab(name, content);
      tab.fileHandle = handle;
      tab.savedContent = content;
      tab.modified = false;
      renderTabs();
      switchTab(tab.id);
    }
    showToast(`✓ ${handles.length} archivo(s) abierto(s)`);
  } catch(e) {
    if (e.name !== 'AbortError') showToast('Error al abrir: ' + e.message);
  }
}

async function saveFile() {
  const tab = getActiveTab();
  if (!tab) return;
  tab.content = editor.value;

  if (tab.fileHandle) {
    try {
      const writable = await tab.fileHandle.createWritable();
      await writable.write(tab.content);
      await writable.close();
      tab.savedContent = tab.content;
      tab.modified = false;
      renderTabs();
      updateModifiedIndicator();
      debouncedSaveToLS();
      showToast('✓ Guardado: ' + tab.name + '.md');
    } catch(e) {
      showToast('Error al guardar: ' + e.message);
    }
  } else {
    await saveFileAs();
  }
}

async function saveFileAs() {
  const tab = getActiveTab();
  if (!tab) return;
  tab.content = editor.value;

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: tab.name + '.md',
        types: [{ description: 'Markdown', accept: {'text/markdown': ['.md']} }]
      });
      tab.fileHandle = handle;
      const writable = await handle.createWritable();
      await writable.write(tab.content);
      await writable.close();
      tab.name = handle.name.replace(/\.md$/i, '');
      tab.savedContent = tab.content;
      tab.modified = false;
      renderTabs();
      updateModifiedIndicator();
      debouncedSaveToLS();
      showToast('✓ Guardado como: ' + tab.name + '.md');
    } catch(e) {
      if (e.name !== 'AbortError') downloadMD();
    }
  } else {
    downloadMD();
  }
}

function downloadMD() {
  const tab = getActiveTab();
  const name = (tab?.name || 'documento') + '.md';
  const content = editor.value;
  const blob = new Blob([content], {type:'text/markdown;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
  showToast('✓ Descargado como ' + name);
}

// ═══════════════════════════════════════════════════
// TOKEN ESTIMATION (aproximación al tokenizador de Claude)
// ═══════════════════════════════════════════════════
function estimateTokens(text) {
  if (!text) return 0;
  // Heurística mixta: combina conteo por caracteres y por "piezas".
  // Para texto natural ES/EN, los tokenizadores BPE producen ~1 token cada
  // ~3.7 caracteres. La puntuación, símbolos y saltos de línea suelen ser
  // tokens propios, así que los contamos aparte para mayor fidelidad.
  const chars = text.length;
  const byChars = chars / 3.7;
  // Piezas: palabras + signos de puntuación/símbolos sueltos
  const pieces = (text.match(/[\w\u00C0-\u017F]+|[^\s\w]/g) || []).length;
  const byPieces = pieces * 1.3;
  // Media ponderada de ambas estimaciones
  return Math.max(1, Math.round((byChars + byPieces) / 2));
}

// ═══════════════════════════════════════════════════
// PREVIEW
// ═══════════════════════════════════════════════════
function updatePreview() {
  if (previewEditing) return;
  const val = editor.value;
  const parsed = parseMarkdown(val);
  if (!val.trim()) {
    preview.innerHTML = '';
    preview.appendChild(emptyState);
  } else {
    emptyState.remove();
    preview.innerHTML = parsed;
  }
  const words = val.trim() ? val.trim().split(/\s+/).length : 0;
  wc.textContent = words;
  cc.textContent = val.length;
  tk.textContent = estimateTokens(val);
  if (wordWrap) {
    const lines = val.split('\n').length;
    lineNums.innerHTML = Array.from({length:lines}, (_,i)=>i+1).join('<br/>');
  }
}

// ═══════════════════════════════════════════════════
// EDITABLE PREVIEW SYNC
// ═══════════════════════════════════════════════════
preview.addEventListener('focus', () => {
  previewEditing = true;
  preview.classList.add('editing-mode');
});

preview.addEventListener('blur', () => {
  clearTimeout(previewSyncTimer);
  previewEditing = false;
  preview.classList.remove('editing-mode');
  // Convert preview HTML back to markdown
  const md = htmlToMarkdown(preview);
  if (md !== editor.value) {
    saveToUndo();
    editor.value = md;
    markTabModified();
    debouncedSaveToLS();
    // Re-render preview from clean markdown
    setTimeout(() => {
      previewEditing = false;
      updatePreview();
    }, 100);
  }
});

preview.addEventListener('input', () => {
  // Debounced sync while typing
  clearTimeout(previewSyncTimer);
  previewSyncTimer = setTimeout(() => {
    const md = htmlToMarkdown(preview);
    editor.value = md;
    markTabModified();
    updateStats();
    debouncedSaveToLS();
  }, 500);
});

// Prevent preview contenteditable from getting focus when in editor-only mode
preview.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveFile();
  }
});

function updateStats() {
  const val = editor.value;
  const words = val.trim() ? val.trim().split(/\s+/).length : 0;
  wc.textContent = words;
  cc.textContent = val.length;
  tk.textContent = estimateTokens(val);
}

// ═══════════════════════════════════════════════════
// UNDO / REDO
// ═══════════════════════════════════════════════════
function saveToUndo() {
  const tab = getActiveTab();
  if (!tab) return;
  if (tab.undoStack[tab.undoStack.length-1] !== editor.value) {
    tab.undoStack.push(editor.value);
    if (tab.undoStack.length > 200) tab.undoStack.shift();
    tab.redoStack = [];
  }
}

function undo() {
  const tab = getActiveTab();
  if (!tab || tab.undoStack.length <= 1) return;
  tab.redoStack.push(tab.undoStack.pop());
  editor.value = tab.undoStack[tab.undoStack.length-1];
  updatePreview();
}

function redo() {
  const tab = getActiveTab();
  if (!tab || !tab.redoStack.length) return;
  const val = tab.redoStack.pop();
  tab.undoStack.push(val);
  editor.value = val;
  updatePreview();
}

// ═══════════════════════════════════════════════════
// EDITOR EVENTS
// ═══════════════════════════════════════════════════
editor.addEventListener('input', () => {
  saveToUndo();
  updatePreview();
  markTabModified();
  debouncedSaveToLS();
});

editor.addEventListener('keyup', updateCursor);
editor.addEventListener('click', updateCursor);

editor.addEventListener('keydown', e => {
  const ctrl = e.ctrlKey || e.metaKey;
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart, en = editor.selectionEnd;
    editor.value = editor.value.substring(0,s) + '  ' + editor.value.substring(en);
    editor.selectionStart = editor.selectionEnd = s + 2;
    saveToUndo(); updatePreview();
  }
  if (ctrl && e.key === 'z') { e.preventDefault(); undo(); }
  if (ctrl && e.key === 'y') { e.preventDefault(); redo(); }
  if (ctrl && e.key === 's' && !e.shiftKey) { e.preventDefault(); saveFile(); }
  if (ctrl && e.key === 's' && e.shiftKey) { e.preventDefault(); saveFileAs(); }
  if (ctrl && e.key === 'b') { e.preventDefault(); wrap('**','**'); }
  if (ctrl && e.key === 'i') { e.preventDefault(); wrap('*','*'); }
  if (ctrl && e.key === 'n') { e.preventDefault(); newTab(); }
  if (ctrl && e.key === 'o') { e.preventDefault(); openFile(); }
  if (ctrl && e.key === 'w') { e.preventDefault(); closeActiveTab(); }
  if (ctrl && e.key === 'f') { e.preventDefault(); openFind(false); }
  if (ctrl && (e.key === 'h' || (e.key === 'f' && e.altKey))) { e.preventDefault(); openFind(true); }
});

function updateCursor() {
  const val = editor.value.substring(0, editor.selectionStart);
  const lines = val.split('\n');
  cursorPos.textContent = `Ln ${lines.length}, Col ${lines[lines.length-1].length + 1}`;
}

function markTabModified() {
  const tab = getActiveTab();
  if (!tab) return;
  tab.content = editor.value;
  const wasModified = tab.modified;
  tab.modified = tab.content !== tab.savedContent;
  if (wasModified !== tab.modified) {
    renderTabs();
    updateModifiedIndicator();
  }
}

function updateModifiedIndicator() {
  const tab = getActiveTab();
  const el = document.getElementById('modifiedIndicator');
  if (tab?.modified) {
    el.style.display = 'flex';
  } else {
    el.style.display = 'none';
  }
}

// ═══════════════════════════════════════════════════
// FIND & REPLACE
// ═══════════════════════════════════════════════════
const findPanel   = document.getElementById('findPanel');
const findInput   = document.getElementById('findInput');
const replaceInput= document.getElementById('replaceInput');
const findCountEl  = document.getElementById('findCount');
let findMatches = [];      // array de {start, end}
let findIndex = -1;        // coincidencia activa
let findOpts = { case:false, word:false, regex:false };

function buildFindRegex() {
  let q = findInput.value;
  if (!q) return null;
  try {
    if (!findOpts.regex) q = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (findOpts.word) q = '\\b' + q + '\\b';
    const flags = 'g' + (findOpts.case ? '' : 'i');
    return new RegExp(q, flags);
  } catch(e) {
    return 'error';
  }
}

function runFind(keepIndex=false) {
  const re = buildFindRegex();
  findMatches = [];
  if (re === 'error') { findCountEl.textContent = 'regex ✕'; findCountEl.classList.add('nores'); return; }
  if (re) {
    const text = editor.value;
    let m;
    while ((m = re.exec(text)) !== null) {
      findMatches.push({ start: m.index, end: m.index + m[0].length });
      if (m[0].length === 0) re.lastIndex++; // evita bucle infinito
    }
  }
  if (!keepIndex || findIndex >= findMatches.length) {
    // Selecciona la coincidencia más cercana al cursor
    const cur = editor.selectionStart;
    findIndex = findMatches.findIndex(mm => mm.start >= cur);
    if (findIndex === -1) findIndex = findMatches.length ? 0 : -1;
  }
  updateFindUI();
}

function updateFindUI() {
  if (!findMatches.length) {
    findCountEl.textContent = findInput.value ? '0 resultados' : '0/0';
    findCountEl.classList.toggle('nores', !!findInput.value);
    return;
  }
  findCountEl.classList.remove('nores');
  findCountEl.textContent = `${findIndex+1}/${findMatches.length}`;
  highlightMatch();
}

function highlightMatch() {
  if (findIndex < 0 || !findMatches[findIndex]) return;
  const { start, end } = findMatches[findIndex];
  editor.focus();
  editor.setSelectionRange(start, end);
  // Scroll aproximado hasta la línea de la coincidencia
  const before = editor.value.substring(0, start);
  const line = before.split('\n').length;
  const lineHeight = parseFloat(getComputedStyle(editor).lineHeight) || 25;
  const target = (line - 1) * lineHeight;
  const area = document.getElementById('editorArea');
  if (target < area.scrollTop || target > area.scrollTop + area.clientHeight - lineHeight*2) {
    area.scrollTop = Math.max(0, target - area.clientHeight/2);
  }
}

function findNav(dir) {
  if (!findMatches.length) return;
  findIndex = (findIndex + dir + findMatches.length) % findMatches.length;
  updateFindUI();
}

function replaceOne() {
  if (findIndex < 0 || !findMatches[findIndex]) { runFind(); return; }
  const { start, end } = findMatches[findIndex];
  saveToUndo();
  const rep = replaceInput.value;
  editor.value = editor.value.substring(0, start) + rep + editor.value.substring(end);
  editor.setSelectionRange(start, start + rep.length);
  markTabModified(); updatePreview(); debouncedSaveToLS();
  runFind(true);
  if (findMatches.length) { if (findIndex >= findMatches.length) findIndex = 0; updateFindUI(); }
  showToast('✓ Reemplazado');
}

function replaceAll() {
  const re = buildFindRegex();
  if (!re || re === 'error' || !findMatches.length) { showToast('Sin coincidencias'); return; }
  saveToUndo();
  const count = findMatches.length;
  editor.value = editor.value.replace(re, replaceInput.value);
  markTabModified(); updatePreview(); debouncedSaveToLS();
  runFind();
  showToast(`✓ ${count} reemplazo(s) realizados`);
}

function toggleFindOpt(opt) {
  findOpts[opt] = !findOpts[opt];
  const map = { case:'findCase', word:'findWord', regex:'findRegex' };
  document.getElementById(map[opt]).classList.toggle('active', findOpts[opt]);
  runFind();
}

function openFind(withReplace=false) {
  findPanel.classList.add('open');
  document.getElementById('replaceRow').style.display = withReplace ? 'flex' : 'none';
  const sel = editor.value.substring(editor.selectionStart, editor.selectionEnd);
  if (sel && !sel.includes('\n')) findInput.value = sel;
  findInput.focus();
  findInput.select();
  runFind();
}

function closeFind() {
  findPanel.classList.remove('open');
  editor.focus();
}

findInput.addEventListener('input', () => runFind());
findInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); findNav(e.shiftKey ? -1 : 1); }
  if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
});
replaceInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); replaceOne(); }
  if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
});

// ═══════════════════════════════════════════════════
// WRAP & INSERT
// ═══════════════════════════════════════════════════
function wrap(before, after) {
  const s = editor.selectionStart, e = editor.selectionEnd;
  const sel = editor.value.substring(s, e) || 'texto';
  const repl = before + sel + after;
  editor.value = editor.value.substring(0,s) + repl + editor.value.substring(e);
  editor.selectionStart = s + before.length;
  editor.selectionEnd   = s + before.length + sel.length;
  editor.focus();
  saveToUndo(); updatePreview(); markTabModified(); debouncedSaveToLS();
}

const blocks = {
  link:       () => '[Texto del enlace](https://url.com)',
  image:      () => '![Descripción](https://url-imagen.com)',
  ul:         () => '- Elemento uno\n- Elemento dos\n- Elemento tres',
  ol:         () => '1. Primero\n2. Segundo\n3. Tercero',
  task:       () => '- [ ] Tarea pendiente\n- [x] Tarea completada',
  blockquote: () => '> "Una cita memorable."',
  code:       () => '```js\n// Tu código aquí\nconsole.log("Hola Claude");\n```',
  table:      () => '| Columna A | Columna B | Columna C |\n|-----------|-----------|----------|\n| Dato 1    | Dato 2    | Dato 3   |\n| Dato 4    | Dato 5    | Dato 6   |',
  hr:         () => '\n---\n',
};

function insertBlock(type) {
  const snip = blocks[type]();
  const s = editor.selectionStart;
  const before = editor.value.substring(0, s);
  const after  = editor.value.substring(s);
  const prefix = (before.length && !before.endsWith('\n')) ? '\n\n' : '';
  const suffix = (!after.startsWith('\n')) ? '\n\n' : '\n';
  editor.value = before + prefix + snip + suffix + after;
  editor.selectionStart = editor.selectionEnd = s + prefix.length + snip.length + suffix.length;
  editor.focus();
  saveToUndo(); updatePreview(); markTabModified(); debouncedSaveToLS();
}

function insertHeading(level) {
  if (!level) return;
  const s = editor.selectionStart;
  const line_start = editor.value.lastIndexOf('\n', s - 1) + 1;
  const prefix = '#'.repeat(+level) + ' ';
  editor.value = editor.value.substring(0, line_start) + prefix + editor.value.substring(line_start);
  editor.focus();
  saveToUndo(); updatePreview(); markTabModified(); debouncedSaveToLS();
}

// ═══════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════
function copyMD() {
  navigator.clipboard.writeText(editor.value).then(() => showToast('✓ Copiado al portapapeles'));
}

function clearEditor() {
  const tab = getActiveTab();
  if (!tab) return;
  if (tab.content.trim() && !confirm('¿Borrar todo el contenido y limpiar el almacenamiento local? Esta acción no se puede deshacer.')) return;
  tab.content = ''; tab.savedContent = ''; tab.modified = false;
  editor.value = '';
  updatePreview();
  renderTabs();
  updateModifiedIndicator();
  try { localStorage.removeItem('claudemd_v3'); } catch(e) {}
  showToast('✓ Limpiado y almacenamiento borrado');
}

function showExample() {
  const tab = getActiveTab();
  if (!tab) return;
  if (tab.content.trim() && !confirm('¿Reemplazar el contenido actual con el ejemplo?')) return;
  saveToUndo();
  editor.value = initialMD;
  updatePreview();
  markTabModified();
  debouncedSaveToLS();
  showToast('✓ Ejemplo cargado');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ═══════════════════════════════════════════════════
// VIEW MODES
// ═══════════════════════════════════════════════════
function setView(mode) {
  currentView = mode;
  const ep = document.getElementById('editorPanel');
  const pp = document.getElementById('previewPanel');
  const dv = document.getElementById('divider');
  const sb = document.getElementById('leftSidebar');

  ['v-split','v-editor','v-preview'].forEach(id => document.getElementById(id)?.classList.remove('active'));
  document.getElementById('v-'+mode)?.classList.add('active');

  ep.classList.remove('hidden');
  pp.classList.remove('hidden');
  dv.style.display = 'block';
  sb.style.display = 'flex';

  if (mode === 'editor') {
    pp.classList.add('hidden');
    dv.style.display = 'none';
  } else if (mode === 'preview') {
    ep.classList.add('hidden');
    sb.style.display = 'none';
    dv.style.display = 'none';
  }
  debouncedSaveToLS();
}

// ═══════════════════════════════════════════════════
// WORD WRAP
// ═══════════════════════════════════════════════════
function applyWordWrap() {
  editor.style.whiteSpace = wordWrap ? 'pre-wrap' : 'pre';
  editor.style.overflowWrap = wordWrap ? 'break-word' : 'normal';
  editor.style.overflowX = wordWrap ? 'hidden' : 'auto';
  lineNums.style.display = wordWrap ? 'none' : 'block';
  document.getElementById('wrapStatus').style.display = wordWrap ? 'inline' : 'none';
  document.getElementById('ww-toggle-btn').textContent = wordWrap ? '☑ Ajuste de línea (activo)' : '☐ Ajuste de línea (inactivo)';
}

function toggleWordWrap() {
  wordWrap = !wordWrap;
  applyWordWrap();
  debouncedSaveToLS();
  showToast(wordWrap ? '✓ Ajuste de línea activado' : '✓ Ajuste de línea desactivado');
}

// ═══════════════════════════════════════════════════
// DRAG DIVIDER
// ═══════════════════════════════════════════════════
const divider = document.getElementById('divider');
const workspace = document.getElementById('workspace');
let dragging = false;

divider.addEventListener('mousedown', e => { dragging = true; divider.classList.add('dragging'); e.preventDefault(); });
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const rect = workspace.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width * 100;
  const clamped = Math.max(20, Math.min(80, pct));
  document.getElementById('editorPanel').style.flex = `0 0 ${clamped}%`;
  document.getElementById('previewPanel').style.flex = `0 0 ${100-clamped-0.3}%`;
});
document.addEventListener('mouseup', () => { dragging = false; divider.classList.remove('dragging'); });

// ═══════════════════════════════════════════════════
// IMPORT FILE
// ═══════════════════════════════════════════════════
function triggerImport() { document.getElementById('fileImport').click(); }

function handleFileImport(event) {
  const files = Array.from(event.target.files);
  files.forEach(loadFileAsTab);
  event.target.value = '';
}

function loadFileAsTab(file) {
  if (!file) return;
  const allowed = ['.md','.markdown','.txt'];
  const ext = '.' + file.name.split('.').pop().toLowerCase();
  if (!allowed.includes(ext)) { showToast('⚠ Solo .md, .markdown o .txt'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const content = e.target.result;
    const name = file.name.replace(/\.(md|markdown|txt)$/i, '');
    const existing = tabs.find(t => t.name === name);
    if (existing) {
      if (!confirm(`La pestaña "${name}" ya existe. ¿Reemplazar su contenido?`)) return;
      existing.content = content;
      switchTab(existing.id);
      return;
    }
    const tab = createTab(name, content);
    tab.savedContent = content;
    tab.modified = false;
    renderTabs();
    switchTab(tab.id);
    showToast('✓ Importado: ' + file.name);
  };
  reader.onerror = () => showToast('✕ Error al leer el archivo');
  reader.readAsText(file, 'UTF-8');
}

// ═══════════════════════════════════════════════════
// DRAG & DROP
// ═══════════════════════════════════════════════════
const dropOverlay = document.getElementById('dropOverlay');
let dragCounter = 0;
document.addEventListener('dragenter', e => { if (e.dataTransfer.types.includes('Files')) { dragCounter++; dropOverlay.classList.add('active'); } });
document.addEventListener('dragleave', e => { dragCounter--; if (dragCounter <= 0) { dragCounter=0; dropOverlay.classList.remove('active'); } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  dragCounter = 0;
  dropOverlay.classList.remove('active');
  Array.from(e.dataTransfer.files).forEach(loadFileAsTab);
});

// ═══════════════════════════════════════════════════
// MENU SYSTEM
// ═══════════════════════════════════════════════════
function toggleMenu(id) {
  if (openMenuId === id) { closeMenu(); return; }
  closeMenu();
  const dd = document.getElementById('dd-' + id);
  const btn = document.querySelector(`#mg-${id} .menu-btn`);
  if (dd) { dd.classList.add('open'); }
  if (btn) btn.classList.add('open');
  openMenuId = id;
}
function closeMenu() {
  if (openMenuId) {
    document.getElementById('dd-' + openMenuId)?.classList.remove('open');
    document.querySelector(`#mg-${openMenuId} .menu-btn`)?.classList.remove('open');
    openMenuId = null;
  }
}
document.addEventListener('click', e => {
  if (!e.target.closest('.menu-group')) closeMenu();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeMenu();
});

// Atajos globales de búsqueda (funcionan aunque el foco no esté en el editor)
document.addEventListener('keydown', e => {
  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && e.key === 'f' && document.activeElement !== editor) {
    if (currentView === 'preview') return;
    e.preventDefault(); openFind(false);
  }
  if (ctrl && e.key === 'h' && document.activeElement !== editor) {
    if (currentView === 'preview') return;
    e.preventDefault(); openFind(true);
  }
});

// ═══════════════════════════════════════════════════
// SIDEBAR TOOLTIPS
// ═══════════════════════════════════════════════════
const sbTooltip = document.getElementById('sb-tooltip');
document.querySelectorAll('.sb-btn[data-tip]').forEach(btn => {
  btn.addEventListener('mouseenter', () => {
    const rect = btn.getBoundingClientRect();
    sbTooltip.textContent = btn.getAttribute('data-tip');
    sbTooltip.style.left = (rect.right + 10) + 'px';
    sbTooltip.style.top = (rect.top + rect.height/2 - 11) + 'px';
    sbTooltip.style.opacity = '1';
  });
  btn.addEventListener('mouseleave', () => { sbTooltip.style.opacity = '0'; });
});

function init() {
  const restored = loadFromLS();
  if (restored && tabs.length > 0) {
    const tab = getActiveTab() || tabs[0];
    editor.value = tab.content;
    renderTabs();
    activeTabId = tab.id;
    renderTabs();
    showToast('✓ Sesión restaurada desde LocalStorage');
  } else {
    const tab = createTab('documento', initialMD);
    tab.savedContent = initialMD;
    tab.modified = false;
    activeTabId = tab.id;
    editor.value = initialMD;
    renderTabs();
  }
  applyWordWrap();
  setView(currentView);
  updatePreview();
  updateCursor();
  updateModifiedIndicator();
  editor.focus();
}

init();
</script>
