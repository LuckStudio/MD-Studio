name: Tests
on:
  push:
  pull_request:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install chrome --with-deps
      - run: npm test
        env: { PW_CHANNEL: chrome }
